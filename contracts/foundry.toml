[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 50
